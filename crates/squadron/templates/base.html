<!doctype html>
<html lang="en" data-theme="squadron">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}Squadron — one brief, N agents, one winner{% endblock %}</title>
  <meta name="description" content="Submit one project brief and N parallel AI agents build it on isolated VMs — a judge crowns the winner in a live gallery.">
  <meta property="og:title" content="Squadron — one brief, N agents, one winner">
  <meta property="og:description" content="One brief, N agents build it in parallel on isolated VMs. A judge crowns the winner.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://squadron.nutomic.com/">
  <meta property="og:image" content="https://squadron.nutomic.com/static/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/island.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script type="module" src="/static/island.js"></script>
</head>
<body class="min-h-screen flex flex-col bg-base-100 text-base-content font-sans antialiased">
  <header class="sticky top-0 z-40 bg-white/85 backdrop-blur border-b border-base-300">
    <div class="h-16 max-w-7xl mx-auto px-4 flex items-center gap-6">
      <a href="/" class="flex items-center gap-2.5 text-[15px] font-semibold tracking-tight text-base-content whitespace-nowrap">
        <svg class="w-5 h-5 text-primary flex-none" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path d="M10 1.5l2.6 5.3 5.9.9-4.2 4.1 1 5.8L10 14.9l-5.3 2.7 1-5.8L1.5 7.7l5.9-.9L10 1.5z" />
        </svg>
        Squadron
      </a>
      <nav class="flex items-center gap-1 text-sm" aria-label="Main">
        <a href="/runs" class="inline-flex items-center min-h-[40px] px-3 rounded-full whitespace-nowrap {% block nav_runs %}text-base-content/70 hover:text-base-content{% endblock %}" {% block nav_runs_attr %}{% endblock %}>Runs</a>
      </nav>
      <div class="flex-1"></div>
      {% block header_cta %}
      <a href="/" class="btn btn-primary btn-sm rounded-full px-5 font-semibold border-0 whitespace-nowrap">New run</a>
      {% endblock %}
    </div>
  </header>

  <main class="flex-1">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-base-200 border-t border-base-300">
    <div class="max-w-7xl mx-auto px-1 py-2 flex flex-wrap items-center gap-x-4 gap-y-2 text-[13px] text-base-content/65 sm:px-4 sm:py-5">
      <nav class="flex items-center gap-x-1 gap-y-1" aria-label="Footer">
        <a href="/" class="inline-flex items-center min-h-[40px] px-3 hover:text-base-content">New run</a>
        <a href="/runs" class="inline-flex items-center min-h-[40px] px-3 hover:text-base-content">Runs</a>
        <span class="ml-1">One brief, many agents in parallel</span>
      </nav>
      <div class="flex-1"></div>
      <span class="mono-num !text-[11px] text-base-content/70 flex items-center gap-2 pr-3 sm:pr-0">
        <span class="inline-block w-1.5 h-1.5 rounded-full bg-success"></span>
        squadron v1.4 &middot; all systems normal
      </span>
    </div>
  </footer>
</body>
</html>
