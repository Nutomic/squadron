{% extends "base.html" %}
{% block title %}sprite swarm — new run{% endblock %}
{% block content %}
<section class="hero py-8">
  <div class="w-full max-w-3xl mx-auto">
    <h1 class="text-3xl font-bold text-primary mb-2">new run</h1>
    <p class="text-base-content/60 mb-6">one brief, N agents build it in parallel on Sprites, a judge picks the winner.</p>
    <form method="post" action="/runs" class="flex flex-col gap-4">
      <textarea id="brief" name="brief" rows="6" required
        class="textarea textarea-bordered w-full bg-base-100 text-base-content placeholder-base-content/30"
        placeholder="describe the web project to build..."></textarea>
      <div class="flex flex-wrap gap-2 items-center">
        <span class="text-xs text-base-content/50 mr-1">samples:</span>
        {% for brief in briefs %}
        <button type="button" class="btn btn-outline btn-xs text-base-content/70" data-brief="{{ brief.text }}">{{ brief.short }}</button>
        {% endfor %}
      </div>
      <div class="flex flex-wrap items-center gap-4">
        <label class="text-sm text-base-content/60" for="n">lanes</label>
        <select id="n" name="n" class="select select-bordered select-sm bg-base-100 w-24">
          {% for i in 3..11 %}
          <option value="{{ i }}" {% if i == 8 %}selected{% endif %}>{{ i }}</option>
          {% endfor %}
        </select>
        <span class="text-xs text-base-content/40">agents compete in parallel</span>
        <div class="flex-1"></div>
        <button type="submit" class="btn btn-primary">launch swarm</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
