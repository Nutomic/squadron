<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <title>{% block title %}sprite swarm{% endblock %}</title>
  <link rel="stylesheet" href="/static/island.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
  <script type="module" src="/static/island.js"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content font-mono">
  <nav class="navbar bg-base-300 border-b border-base-content/10 px-4">
    <a href="/" class="btn btn-ghost text-primary font-bold tracking-tight">sprite&nbsp;swarm</a>
    <div class="flex-1"></div>
    <a href="/runs" class="btn btn-ghost btn-sm text-base-content/70">runs</a>
  </nav>
  <main class="max-w-7xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="max-w-7xl mx-auto px-4 pb-8 text-xs text-base-content/40">
    agents build on sprites &middot; judge crowns the winner
  </footer>
</body>
</html>
