[workspace]
resolver = "2"
members = [
    "crates/swarm",
    "crates/sprites-client",
    "crates/llm-gateway",
    "crates/store",
    "crates/orchestrator",
    "crates/prompts",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "tls-rustls"], default-features = false }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
fs2 = "0.4"
sprites-client = { path = "crates/sprites-client" }
llm-gateway = { path = "crates/llm-gateway" }
prompts = { path = "crates/prompts" }
store = { path = "crates/store" }
